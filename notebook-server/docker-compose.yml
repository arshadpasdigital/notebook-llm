services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant-prod
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333" # REST API
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config:/qdrant/config
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-1bfb80a5-7ca3-4ee5-bb0e-dcd65186ba2d}
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL:-INFO}
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "8G"
        reservations:
          cpus: "2.0"
          memory: "4G"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - qdrant_net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-your_strong_password}
    restart: unless-stopped

  bull-board:
    image: venatum/bull-board:latest
    container_name: bullmq-dashboard
    ports:
      - "${BULL_BOARD_PORT:-4000}:3000"
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - bullmq-network

networks:
  qdrant_net:
  bullmq-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
