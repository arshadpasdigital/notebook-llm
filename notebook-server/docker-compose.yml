version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant-prod
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config:/qdrant/config
    environment:
      - QDRANT__SERVICE__API_KEY=your-secret-key-here
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "8G"
        reservations:
          cpus: "2.0"
          memory: "4G"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - qdrant_net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass your_strong_password
    restart: unless-stopped


networks:
  qdrant_net:
    driver: bridge   

volumes:
  qdrant_data:
    driver: local
  reids_data:
    driver: local